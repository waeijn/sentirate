version: "3.8"

services:
  core:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.core
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
      - LOG_LEVEL=INFO
    volumes:
      - ../../src:/app/src
      - ../../data/logs:/app/data/logs

  dashboard-backend:
    build:
      context: ../../dashboard/backend
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8050
    depends_on:
      - core

  dashboard-frontend:
    build:
      context: ../../dashboard/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8050
    depends_on:
      - dashboard-backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
