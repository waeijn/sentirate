# ============================================================
#  redis.conf — Durable Redis for Adaptive Rate Limiter
#  Satisfies IT Panelist Durability Requirement:
#  Max data loss on hard crash = ~1 second (AOF everysec).
# ============================================================


# ── Bind & Port ──────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no


# ── Persistence Strategy: AOF (Primary) ──────────────────────
#
#  AOF replays every write command on restart, recovering state
#  right up to the last fsync. Combined with RDB snapshots for
#  fast cold-start loading.
#
appendonly yes

#  everysec  → fsyncs the AOF file once per second.
#              Worst-case data loss on crash = ~1 second.
#              Best balance of durability vs throughput.
#
#  always    → fsync after every write. Zero data loss but ~10x
#              slower — overkill for rate-limiter state.
#
#  no        → OS decides when to flush. Fast, but can lose many
#              seconds of data. DO NOT USE.
#
appendfsync everysec

#  Rewrite the AOF file when it doubles AND exceeds 64 MB.
#  Keeps the file compact; prevents unbounded disk growth.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

#  On AOF rewrite, continue fsyncing the active AOF.
#  Slightly slower rewrite but prevents data loss during it.
no-appendfsync-on-rewrite no

#  Persist AOF file here (use full path in production)
dir /data
appendfilename "appendonly.aof"


# ── Persistence Strategy: RDB (Secondary / Fast Restart) ─────
#
#  RDB snapshot is a point-in-time fork. Used as a fast-load
#  base when Redis restarts; AOF then replays deltas on top.
#
dbfilename dump.rdb

#  Save snapshot if N keys changed in T seconds:
#    900s  with ≥1  change  (15 min idle — catch slow traffic)
#    300s  with ≥10 changes (5 min moderate traffic)
#    60s   with ≥1000 changes (heavy burst activity)
save 900 1
save 300 10
save 60  1000

#  If RDB save fails (disk full etc.), stop accepting writes so
#  the operator knows immediately rather than silently losing data.
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes


# ── Memory Management ─────────────────────────────────────────
#
#  Set a hard ceiling. When reached, evict using allkeys-lru
#  (evict least-recently-used keys across the entire keyspace).
#  Rate limiter state for inactive clients is cleanly evicted.
#  Adjust to ~70% of available RAM.
#
maxmemory 512mb
maxmemory-policy allkeys-lru


# ── Performance Tuning ────────────────────────────────────────

#  TCP backlog — keep connections queued during 10k-user spikes.
tcp-backlog 511

#  Keepalive: detect dead clients every 60s.
tcp-keepalive 60

#  Number of databases (we only use db 0, but keep default).
databases 16

#  Disable slow-log entries under 10ms — keeps logs clean under load.
slowlog-log-slower-than 10000
slowlog-max-len 128


# ── Logging ───────────────────────────────────────────────────
loglevel notice
logfile ""


# ── Lua Scripting ─────────────────────────────────────────────
#  Max time a Lua script can block the server (ms).
#  Our token-bucket Lua runs in ~0.05ms, well under this.
lua-time-limit 5000
